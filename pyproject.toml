[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-decoding"
version = "0.1.0"
description = "Speculative decoding: harness, training, eval, analysis"
requires-python = ">=3.12"

# Pinned to the exact versions in Kaggle's image, probed 2026-09-10.
# Matching the image is the point: `pip install -e . --no-deps` in a session
# then installs nothing, so pip never gets the chance to "satisfy" torch by
# pulling a CPU wheel from PyPI over the CUDA build. Re-probe on image bumps
# (kernels/gpu-probe) and move these pins deliberately, not by accident.
dependencies = [
    "torch==2.10.0",
    "transformers==5.0.0",
    "accelerate==1.13.0",
    "datasets==5.0.0",
    "wandb==0.26.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.setuptools]
packages = ["harness", "training", "eval", "analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
